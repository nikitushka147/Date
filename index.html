<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підемо на побачення? 💖</title>

    <!-- Бібліотека EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Запобігає появі скролбарів, коли кнопка тікає */
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            z-index: 2; /* Щоб картка була над фоном */
        }

        h1, h2 {
            color: #d63384;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-yes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            z-index: 3;
        }

        .btn-yes:hover {
            background-color: #e84118;
            transform: scale(1.08);
        }

        /* Кнопка "Ні" тепер має абсолютне позиціонування відносно всього екрана */
        .btn-no {
            background-color: #747d8c;
            color: white;
            position: fixed; /* Позиціонування відносно всього вікна браузера */
            transition: left 0.2s ease-out, top 0.2s ease-out; /* Плавний рух по всьому екрану */
            z-index: 10;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
        }

        input:focus, select:focus {
            border-color: #ff4757;
        }

        .summary-item {
            background: #fff0f3;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
            border-left: 4px solid #ff4757;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- КРОК 1 -->
        <div id="step-1" class="step active">
            <h1>Привіт! 💖</h1>
            <p>У мене є до тебе одне дуже важливе запитання...</p>
            <h2>Підеш зі мною на побачення?</h2>
            <div class="btn-group">
                <button class="btn-yes" onclick="nextStep(2)">ТАК! 🥳</button>
            </div>
        </div>

        <!-- КРОК 2 -->
        <div id="step-2" class="step">
            <h2>Чудово! 🎉</h2>
            <p>Тепер давай сплануємо наш ідеальний день:</p>

            <div class="form-group">
                <label for="date">📅 Дата:</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="time">⏰ Час:</label>
                <input type="time" id="time">
            </div>

            <div class="form-group">
                <label for="format">✨ Формат побачення:</label>
                <select id="format">
                    <option value="Затишна прогулянка">Затишна прогулянка</option>
                    <option value="Романтичний вечір">Романтичний вечір</option>
                    <option value="Активний відпочинок / Пригоди">Активний відпочинок / Пригоди</option>
                    <option value="Кіно або театр">Кіно або театр</option>
                </select>
            </div>

            <div class="form-group">
                <label for="place">📍 Куди підемо?</label>
                <input type="text" id="place" placeholder="Наприклад: Парк, Затишна кав'ярня...">
            </div>

            <div class="form-group">
                <label for="food">🍕 Що будемо їсти?</label>
                <input type="text" id="food" placeholder="Наприклад: Піца, Суші, Морозиво...">
            </div>

            <button class="btn-yes" style="width: 100%;" onclick="finishPlanner()">Зафіксувати план ✨</button>
        </div>

        <!-- КРОК 3 -->
        <div id="step-3" class="step">
            <h2>До зустрічі! 🥰</h2>
            <p>Я вже з нетерпінням чекаю на цей день!</p>
            <div id="summary"></div>
            <div id="email-status" class="status-msg"></div>
        </div>
    </div>

    <!-- Кнопка "Ні" винесена з картки, щоб вільно літати по всій сторінці -->
    <button class="btn-no" id="no-btn">Ні 😜</button>

    <script>
        const noBtn = document.getElementById('no-btn');

        // Встановлюємо початкове положення кнопки біля картки після завантаження сторінки
        window.addEventListener('load', () => {
            const yesBtn = document.querySelector('.btn-yes');
            const rect = yesBtn.getBoundingClientRect();
            noBtn.style.left = `${rect.right + 20}px`;
            noBtn.style.top = `${rect.top}px`;
        });

        // Функція втечі по ВСЬОМУ екрану
        function moveButton() {
            // Отримуємо ширину та висоту всього вікна браузера
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // Отримуємо розміри самої кнопки
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Відступаємо від країв екрана (padding) на 20px, щоб кнопка не вилітала за рамки
            const padding = 20;

            const maxLeft = screenWidth - btnWidth - padding;
            const maxTop = screenHeight - btnHeight - padding;

            // Генеруємо випадкові координати в межах всього екрана
            const randomLeft = Math.max(padding, Math.floor(Math.random() * maxLeft));
            const randomTop = Math.max(padding, Math.floor(Math.random() * maxTop));

            // Задаємо нові позиції
            noBtn.style.left = `${randomLeft}px`;
            noBtn.style.top = `${randomTop}px`;
        }

        // Події втечі
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Щоб не було кліка на сенсорних екранах
            moveButton();
        });

        // Перехід між кроками
        function nextStep(stepNumber) {
            // Ховаємо кнопку "Ні", коли людина натиснула "ТАК"
            if(stepNumber > 1) {
                noBtn.style.display = 'none';
            }

            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById(`step-${stepNumber}`).classList.add('active');
        }

        // Фінал та відправка Email
        function finishPlanner() {
            const date = document.getElementById('date').value || 'Не вказано';
            const time = document.getElementById('time').value || 'Не вказано';
            const format = document.getElementById('format').value;
            const place = document.getElementById('place').value || 'На твій вибір 😉';
            const food = document.getElementById('food').value || 'Смачненьке 😋';

            const summaryHTML = `
                <div class="summary-item"><strong>📅 Дата:</strong> ${date}</div>
                <div class="summary-item"><strong>⏰ Час:</strong> ${time}</div>
                <div class="summary-item"><strong>✨ Формат:</strong> ${format}</div>
                <div class="summary-item"><strong>📍 Місце:</strong> ${place}</div>
                <div class="summary-item"><strong>🍕 Меню:</strong> ${food}</div>
            `;
            document.getElementById('summary').innerHTML = summaryHTML;
            nextStep(3);

            // EMAILJS Налаштування (заміни на свої ключі)
            const PUBLIC_KEY = "ТВІЙ_PUBLIC_KEY"; 
            const SERVICE_ID = "ТВІЙ_SERVICE_ID"; 
            const TEMPLATE_ID = "ТВІЙ_TEMPLATE_ID"; 

            emailjs.init(PUBLIC_KEY);

            const templateParams = {
                date: date,
                time: time,
                format: format,
                place: place,
                food: food
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function(response) {
                    document.getElementById('email-status').innerText = "📩 Деталі успішно надіслані!";
                }, function(error) {
                    console.log('Помилка відправки:', error);
                });
        }
    </script>
</body>
</html>
